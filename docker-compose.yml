version: "3.8"

services:
  notifapi:
    image: ghcr.io/jasondale/notifapi:latest
    container_name: notifapi
    restart: unless-stopped
    ports:
      - "10887:10887"
    environment:
      - NOTIF_API_NAME=notifapi
      - NOTIF_API_INSTANCEID=${INSTANCE_ID}
      - NOTIF_API_PORT=10887
      - NOTIF_API_POSTGRESHOST=${POSTGRES_HOST}
      - NOTIF_API_POSTGRESPORT=${POSTGRES_PORT}
      - NOTIF_API_POSTGRESUSER=${POSTGRES_USER}
      - NOTIF_API_POSTGRESDB=${POSTGRES_DB}
      - NOTIF_API_POSTGRESPASS=${POSTGRES_PASSWORD}
      - NOTIF_API_SECRETKEY=${SECRET_KEY}
      - NOTIF_API_JWTKEY=${JWT_KEY}
      - NOTIF_API_IPINFOTOKEN=${IPINFO_TOKEN}
      - NOTIF_API_DISCORDWEBHOOK=${DISCORD_WEBHOOK}
      - NOTIF_API_LOGFILEPATH=/app/logs/
      - NOTIF_API_DEVMODE=false
    volumes:
      - notifapi-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:10887/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  notifapi-logs: